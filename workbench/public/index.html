<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>企画のワークベンチ</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="app-name">家族の買い物リスト　社内の画面</p>
      <nav class="tabs" aria-label="画面の切り替え">
        <a href="#crm" class="tab" id="tab-crm"
          >顧客管理（CRM）<small>営業・サポート担当者</small></a
        >
        <a href="#docs" class="tab" id="tab-docs">文書ツール<small>企画担当者</small></a>
      </nav>
      <h1 id="screen-title"></h1>
      <p class="lead" id="screen-lead"></p>
    </header>

    <main>
      <!-- 顧客管理（CRM）：営業・サポート担当者の画面 -->
      <div class="screen" id="screen-crm">
        <section class="card" id="card-agenda">
          <h2>① ヒアリングのアジェンダを作る</h2>
          <div class="grid">
            <label class="field">
              <span>お客さんの情報</span>
              <select id="agenda-user"></select>
            </label>
            <label class="field">
              <span>これまでの問い合わせ</span>
              <select id="agenda-inquiries"></select>
            </label>
          </div>
          <fieldset class="field">
            <legend>過去の議事録</legend>
            <div id="agenda-minutes" class="checks"></div>
          </fieldset>
          <button type="button" id="agenda-run" class="primary">アジェンダを作る</button>
          <div class="status" id="agenda-status" aria-live="polite"></div>
          <div class="result" id="agenda-result"></div>
        </section>

        <section class="card" id="card-transcribe">
          <h2>② 録音を文字起こしする</h2>
          <label class="field">
            <span>録音</span>
            <select id="audio-select"></select>
          </label>
          <audio id="audio-player" controls preload="none"></audio>
          <button type="button" id="transcribe-run" class="primary">文字起こしする</button>
          <div class="status" id="transcribe-status" aria-live="polite"></div>
          <div class="result" id="transcript-result"></div>
        </section>

        <section class="card" id="card-minutes">
          <h2>③ 文字起こしから議事録を作る</h2>
          <label class="field">
            <span>文字起こし</span>
            <select id="minutes-transcript" class="transcript-select"></select>
          </label>
          <button type="button" id="minutes-run" class="primary">議事録にする</button>
          <div class="status" id="minutes-status" aria-live="polite"></div>
          <div class="result" id="minutes-result"></div>
        </section>

        <section class="card" id="card-crm">
          <h2>④ 文字起こしを顧客管理に登録する</h2>
          <p class="hint">
            文字起こしから、お客さんの声を1件の記録にまとめて登録します。登録した記録は、企画担当者が
            PRD を作るときに読めます。
          </p>
          <label class="field">
            <span>文字起こし</span>
            <select id="crm-transcript" class="transcript-select"></select>
          </label>
          <button type="button" id="crm-run" class="primary">顧客管理に登録する</button>
          <div class="status" id="crm-status" aria-live="polite"></div>
          <h3 class="table-title">登録済みのお客さんの声</h3>
          <p class="saved" id="crm-path"></p>
          <div class="table-wrap">
            <table class="records">
              <thead>
                <tr>
                  <th>番号</th>
                  <th>日付</th>
                  <th>お客さん</th>
                  <th>経路</th>
                  <th>分類</th>
                  <th>困りごと</th>
                  <th>要望</th>
                  <th>そのままの言葉</th>
                  <th>対応の状況</th>
                </tr>
              </thead>
              <tbody id="crm-rows"></tbody>
            </table>
          </div>
        </section>
      </div>

      <!-- 文書ツール：企画担当者の画面 -->
      <div class="screen" id="screen-docs" hidden>
        <section class="card" id="card-prd">
          <h2>PRD を作る</h2>
          <fieldset class="field">
            <legend>読ませる資料</legend>
            <div id="prd-sources" class="source-groups"></div>
          </fieldset>
          <label class="field">
            <span>依頼（任意）</span>
            <textarea id="prd-request" rows="2">
家族の端末どうしで同じリストを見る仕組みは、次の段階にします</textarea>
          </label>
          <button type="button" id="prd-run" class="primary">PRD を書く</button>
          <div class="status" id="prd-status" aria-live="polite"></div>
          <div class="result" id="prd-result"></div>
          <form id="prd-questions" class="questions" hidden>
            <h3>決まっていないこと</h3>
            <div id="prd-question-list"></div>
            <button type="submit" id="prd-answer" class="primary">答えを PRD に反映する</button>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
