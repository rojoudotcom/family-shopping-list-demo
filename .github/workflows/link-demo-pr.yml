# デモ用：チケットができたら、前日に用意した PR の説明に「Fixes #番号」を書き、
# PR をマージしたときに、そのチケットが閉じて、かんばんで Done に移るようにする。
# 前日の PR は、その場で作るチケットより前にできているため、つなぐ先を後から書き換える。
name: デモの PR をチケットにつなぐ

on:
  issues:
    types: [opened]

permissions:
  pull-requests: write
  issues: read

jobs:
  link:
    # チケットのひな形（.github/ISSUE_TEMPLATE/ticket.md）で書かれた Issue だけを対象にする
    if: contains(github.event.issue.body, '元の PRD')
    runs-on: ubuntu-latest
    steps:
      - name: 前日の PR の説明に Fixes #番号 を書く
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: copilot/add-delete-purchased-items-button
        run: |
          pr=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "前日の PR が開いていないので、何もしない"
            exit 0
          fi
          body=$(gh pr view "$pr" -R "$REPO" --json body -q .body | sed -E '/^- (Fixes|Closes) #[0-9]+$/d')
          printf '%s\n\n- Fixes #%s\n' "$body" "$ISSUE" | gh pr edit "$pr" -R "$REPO" --body-file -
          echo "PR #$pr を Issue #$ISSUE につないだ"
